
<!DOCTYPE html>
<html>

<head>
    
    <title>MediStock - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    

    <header class="header">

        <div class="logo">
            Medi<span>Stock</span>
        </div>

        <div class="nav">
            <a href="index.html">Home</a>
            <a href="#">Features</a>
            <a href="#">About</a>
        </div>

    </header>


    

    <section class="login-section">

        <div class="login-container">

            

            <div class="login-info">

                <h1>Welcome Back to
                    <span>MediStock</span>
                </h1>

                <p>
                    Manage your pharmacy smarter with
                    our powerful pharmacy management
                    platform.
                </p>

                
                
            </div>


            

            <div class="login-form">

                <div class="icon">
                    <span>✚</span>
                </div>

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to your account
                </p>


                <form>

                    <label>Email Address</label>

                    <input
                    type="email"
                    placeholder="Enter your email"
                    required>


                    <label>Password</label>

                    <input
                    type="password"
                    placeholder="Enter your password"
                    required>


                    <div class="options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

 <a href="#">Forgot Password?</a>

</div>


<button type="submit">
Log In →
</button>
</form>


 <p class="signup">
Don't have an account?
 <a href="signup.html">Sign Up</a>
</p>

</div>

</div>

</section>

</body>
</html>
